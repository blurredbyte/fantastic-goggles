# This is a GitHub Actions workflow to demonstrate integrating a security scanner into CI.
# This workflow scans the repository for secrets on every push.

name: Security Scan

# Triggers the workflow on push events to any branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trufflehog-scan:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code
      - name: Check out code
        uses: actions/checkout@v3
        with:
          # Fetch all history for all branches and tags for a full scan
          fetch-depth: 0

      # Step 2: Run the TruffleHog scanner
      # This uses a pre-built GitHub Action for TruffleHog.
      - name: Run TruffleHog to find secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # We provide the path to scan. '.' means the entire repository.
          path: .
          # We can add extra arguments if needed. For example, to fail the build
          # if secrets are found, you might add --fail.
          # The default behavior of this action is to fail on finding secrets.
          args: --fail
